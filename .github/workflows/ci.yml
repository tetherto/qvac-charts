name: Integrate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Trigger note: uses `pull_request` (not `pull_request_target`) so the workflow
# runs in the PR-head context.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: holepunchto/actions/checkout@v1

      - name: Setup Node.js
        uses: holepunchto/actions/setup-node@v1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Library surface compiles
        run: bun run build:lib

      # Every lane here installs with bun; only the publish lane uses npm, which
      # refuses manifests bun accepts — a mismatched override, a peer conflict.
      # Without this the release run is the first thing to notice.
      - name: Manifest resolves under npm
        run: npm install --dry-run --ignore-scripts --allow-git=none

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: holepunchto/actions/checkout@v1

      - name: Setup Node.js
        uses: holepunchto/actions/setup-node@v1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bare comes from the pinned bare-runtime dev dependency
      - name: Tests
        run: bun run test
